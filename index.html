<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AI Quick Launcher</title>
    <style>
        :root {
            --accent: #8ab4f8;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* Fully transparent so the title bar strip isn't a solid black bar
               when the window opacity is lowered. The chooser paints its own
               solid panel; the loaded assistant paints the BrowserView. */
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e8e8ea;
        }

        /* ---------------- Title bar ---------------- */
        .titlebar {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            -webkit-app-region: drag;
            user-select: none;
            /* Normal, visible strip at full opacity. Its background alpha is
               driven live by the transparency slider (see script) so the bar
               melts away together with the window instead of lingering as a
               solid dark band when you increase transparency. */
            background: rgba(24, 24, 28, 0.85);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            gap: 8px;
        }

        .switcher {
            display: flex;
            gap: 4px;
            -webkit-app-region: no-drag;
        }

        .pill {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .pill:hover {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.85);
        }

        .pill.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent) inset;
        }

        .spacer {
            flex: 1;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            -webkit-app-region: no-drag;
            opacity: 0.45;
            transition: opacity 0.2s ease;
        }

        .titlebar:hover .controls {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            border-radius: 6px;
            line-height: 1;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 80px;
            background: rgba(255, 255, 255, 0.12);
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* ---------------- Chooser ---------------- */
        #chooser {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* Sit behind the title bar (which floats on top) so the picker is one
               continuous solid, readable panel with no transparent strip above. */
            padding-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: rgba(20, 20, 22, 0.98);
            border-radius: 12px;
        }

        .chooser-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .chooser-title span {
            opacity: 0.5;
            font-weight: 400;
            font-size: 14px;
            display: block;
            margin-top: 6px;
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            width: 150px;
            height: 160px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--card-accent);
        }

        .badge {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #10100f;
            background: var(--card-accent);
        }

        .card-name {
            font-size: 15px;
            font-weight: 600;
        }

        .card-key {
            font-size: 11px;
            opacity: 0.4;
        }

        .native-tag {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--card-accent);
            color: #10100f;
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="titlebar">
        <div class="switcher" id="switcher"></div>
        <div class="spacer"></div>
        <div class="controls">
            <button class="icon-btn" id="homeBtn" title="Choose assistant">⌂</button>
            <input type="range" id="opacitySlider" min="0.2" max="1.0" step="0.05" value="1.0"
                title="Adjust Transparency">
        </div>
    </div>

    <div id="chooser">
        <div class="chooser-title">
            Choose your assistant
            <span>You can switch anytime from the top bar</span>
        </div>
        <div class="cards" id="cards"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const cards = document.getElementById('cards');
        const switcher = document.getElementById('switcher');
        const chooser = document.getElementById('chooser');
        const slider = document.getElementById('opacitySlider');

        // The available assistants are provided by the main process (native
        // options like "Claude App" are only included when actually installed).
        ipcRenderer.on('init-config', (e, services) => {
            cards.innerHTML = '';
            switcher.innerHTML = '';

            services.forEach((s) => {
                // Chooser card
                const card = document.createElement('div');
                card.className = 'card';
                card.style.setProperty('--card-accent', s.accent);
                card.innerHTML = `
                    <div class="badge">${s.letter}</div>
                    <div class="card-name">${s.name}</div>`;
                card.addEventListener('click', () => ipcRenderer.send('select-service', s.key));
                cards.appendChild(card);

                // Titlebar switcher pill
                const pill = document.createElement('button');
                pill.className = 'pill';
                pill.dataset.key = s.key;
                pill.textContent = s.name;
                pill.addEventListener('click', () => ipcRenderer.send('select-service', s.key));
                switcher.appendChild(pill);
            });
        });

        function setActive(key, accent) {
            chooser.classList.add('hidden');
            document.documentElement.style.setProperty('--accent', accent);
            document.querySelectorAll('.pill').forEach(p => {
                p.classList.toggle('active', p.dataset.key === key);
            });
        }

        ipcRenderer.on('service-changed', (e, { key, accent }) => setActive(key, accent));

        ipcRenderer.on('show-chooser', () => {
            chooser.classList.remove('hidden');
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        });

        const titlebar = document.querySelector('.titlebar');

        // Fade the title-bar's own background along with the transparency slider.
        // Full opacity -> a normal visible strip; minimum -> fully see-through,
        // so the bar melts away instead of leaving a dark band over the content.
        function applyBarTransparency(value) {
            const t = (value - 0.2) / 0.8;            // slider min is 0.2
            const alpha = Math.max(0, Math.min(1, t)) * 0.85;
            titlebar.style.background = `rgba(24, 24, 28, ${alpha.toFixed(3)})`;
        }

        ipcRenderer.on('init-opacity', (e, value) => {
            slider.value = value;
            applyBarTransparency(value);
        });

        document.getElementById('homeBtn').addEventListener('click', () => ipcRenderer.send('open-chooser'));

        slider.addEventListener('input', (event) => {
            const value = parseFloat(event.target.value);
            ipcRenderer.send('set-opacity', value);
            applyBarTransparency(value);
        });

        // Initialise the bar to match the slider's starting value.
        applyBarTransparency(parseFloat(slider.value));
    </script>
</body>

</html>
